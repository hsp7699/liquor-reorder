# Cloudflare Worker: serves the planner page (public/) and the storage API (src/).
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "liquor-reorder"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Shared storage: create this bucket in R2 with exactly this name before deploying.
[[r2_buckets]]
binding = "DATA"
bucket_name = "liquor-reorder-data"

# Cloudflare Access settings. Until both are filled in, the storage API stays closed and the
# planner keeps everything in each browser, like before.
#   ACCESS_TEAM_DOMAIN: your team domain ("yourteam.cloudflareaccess.com") or the key address
#                       Cloudflare shows ("https://yourteam.cloudflareaccess.com/cdn-cgi/access/certs")
#   ACCESS_AUD: the audience (AUD) tag Cloudflare shows for the Access application
[vars]
ACCESS_TEAM_DOMAIN = "https://curly-brook-2a76.cloudflareaccess.com/cdn-cgi/access/certs"
ACCESS_AUD = "003c450f4e3e23edf0388068207244809561890da03c629050d3b994955398aa"

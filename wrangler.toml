# Cloudflare Pages project. The site is the single page in public/; the storage API is in functions/.
name = "liquor-reorder"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# Shared storage: create this bucket in R2 with exactly this name.
[[r2_buckets]]
binding = "DATA"
bucket_name = "liquor-reorder-data"

# Cloudflare Access settings. Until both are filled in, the storage API stays closed and the
# planner keeps everything in each browser, like before.
#   ACCESS_TEAM_DOMAIN: your Zero Trust team domain, e.g. "yourteam.cloudflareaccess.com"
#   ACCESS_AUD: the Application Audience (AUD) tag from the Access application
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Cloudflare Worker: serves the planner page (public/) and the storage API (src/).
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "liquor-reorder"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Shared storage: create this bucket in R2 with exactly this name before deploying.
[[r2_buckets]]
binding = "DATA"
bucket_name = "liquor-reorder-data"

# Who can use the shared storage. The storage API stays closed until one of these is set up.
#
# Store password (what this store uses): set a secret named APP_PASSWORD in the Cloudflare dashboard,
# Worker -> Settings -> Variables and Secrets -> Add -> type "Secret". At least 8 characters. It is never
# kept in this file. Each browser asks for it once and stays signed in for 90 days; changing it signs
# every browser out.
#
# Cloudflare Access (optional, instead of or as well as the password):
#   ACCESS_TEAM_DOMAIN: your team domain ("yourteam.cloudflareaccess.com") or the key address
#                       Cloudflare shows ("https://yourteam.cloudflareaccess.com/cdn-cgi/access/certs")
#   ACCESS_AUD: the audience (AUD) tag Cloudflare shows for the Access application
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
